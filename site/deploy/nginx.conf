# Copy the complete web/ directory into /srv/www/sunfleck-docs/.
# Include these locations inside an existing HTTPS server block.
location /docs/ {
    alias /srv/www/sunfleck-docs/;
    index index.html;
    types {
        text/html html;
        text/javascript js;
        application/wasm wasm;
        application/json json;
        application/octet-stream data;
        font/ttf ttf;
        text/plain txt;
    }
    default_type application/octet-stream;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
# For a dedicated site at /, replace `location /docs/` with `location /`.
# Hash routes are browser-local and need no try_files SPA rewrite.
